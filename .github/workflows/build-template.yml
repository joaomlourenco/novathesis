name: Build the LaTeX template

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Compile the LaTeX template
        uses: xu-cheng/texlive-action/full@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          run: |
            apk add --no-cache make bash grep
            make BATCH=1 V=1
