name: Build the LaTeX template

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile the LaTeX template
        uses: xu-cheng/texlive-action/full@13fd419112d7a5cfd158ed95cead7c6adda70c7f # v1
        with:
          run: |
            apk add --no-cache make bash grep
            make BATCH=1 V=1
